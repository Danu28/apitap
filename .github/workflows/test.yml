name: test
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check apitap.test.js && node --check background.js && node --check popup.js && node --check utils/correlation.js && node --check utils/debugcapture.js && node --check utils/filter.js && node --check utils/postman.js
      - run: node apitap.test.js